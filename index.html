<title>烟花情书</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a20">
<meta name="format-detection" content="telephone=no">
<meta name="x5-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<style>
  :root {
    --ink: #5a3a44;
    --paper: #fff8ee;
    --gold: #ffd98a;
    --rose: #e0568a;
    --hand: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', 'Noto Serif SC', 'Noto Sans SC', -apple-system, sans-serif;
    --script: 'Brush Script MT', 'Snell Roundhand', 'Kaiti SC', cursive;
    --poem: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', 'Noto Serif SC', 'Noto Sans SC', -apple-system, sans-serif;
    --kai: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', 'Noto Serif SC', 'Noto Sans SC', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    background: #0a0a20;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--hand);
    -webkit-font-smoothing: antialiased;
  }

  /* 全屏画布：背景、星点、光尘、花瓣、冲击波、闪光全部在此绘制 */
  #fx {
    position: fixed; inset: 0;
    z-index: 1;
    display: block;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* 提示文字 */
  .hint {
    position: fixed;
    left: 50%; top: 30%;
    transform: translateX(-50%);
    z-index: 2;
    margin: 0;
    font-family: var(--script);
    font-size: clamp(1.2rem, 4vw, 1.7rem);
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 16px rgba(255, 214, 138, .55);
    pointer-events: none;
    white-space: nowrap;
    animation: hintBlink 2.6s ease-in-out infinite;
    transition: opacity .5s;
  }
  .hint.hide { opacity: 0; }
  @keyframes hintBlink {
    0%, 100% { opacity: .25; }
    50%      { opacity: 1; }
  }

  /* 信纸舞台：负责「出现」的缩放/透明，以及 3D 透视（去掉 filter，避免压扁 preserve-3d） */
  .letter-stage {
    position: fixed;
    left: 50%; top: 50%;
    width: min(85vw, 520px);
    z-index: 6;
    perspective: 1200px;
    transform: translate(-50%, -50%) scale(.32);
    opacity: 0;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition:
      transform 1.15s cubic-bezier(.2, .8, .3, 1),
      opacity 1.15s ease;
  }
  .letter-stage.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  /* 浮动层：仅做 2D 上下浮动（preserve-3d 让翻转穿透）。
     注意：此处切勿用 rotateX/rotateY 等 3D 变换，否则会破坏 .page 的
     backface-visibility 命中测试，导致翻页按钮在 Chrome 中点击无响应。 */
  .letter-bob {
    transform-style: preserve-3d;
    animation: letterFloat 3s ease-in-out infinite;
  }
  @keyframes letterFloat {
    0%, 100% { transform: translateY(-5px); }
    50%      { transform: translateY(5px); }
  }

  /* 3D 翻转容器：preserve-3d。翻页共一圈半（1.5×360°=540°），由 JS 逐帧驱动，
     整体一次「快—慢—快」节奏；540°≡180° 恰好自然落到第二页，无需交换正反面。
     .flipped 的静态 180° 是 reduced-motion 下的兜底。 */
  .letter-flip {
    position: relative;
    width: 100%;
    height: min(88vh, 680px);
    height: min(88dvh, 680px);   /* iOS 动态视口高度：URL 栏收起/展开时始终贴合可见区域 */
    transform-style: preserve-3d;
    transform: rotateY(0deg);
  }
  .letter-flip.flipped { transform: rotateY(180deg); }

  /* 信纸页面（正/反两页共用纸张样式） */
  .page {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 30px 30px 34px;
    border-radius: 8px 8px 18px 18px;
    background:
      radial-gradient(circle at 8% 4%, rgba(245, 210, 122, .16), transparent 34%),
      linear-gradient(180deg, #fffdf6 0%, var(--paper) 100%);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(224,169,79,.25);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .page-back { transform: rotateY(180deg); }

  /* 页面可滚动内容区（第二页正文较长，可滚动阅读） */
  .page-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* 每页底部固定的翻页按钮 */
  .page-footer {
    flex-shrink: 0;
    padding-top: 18px;
    text-align: center;
  }
  .page-btn {
    min-width: 44px; min-height: 44px;
    padding: 10px 26px;
    border: 1px solid rgba(224, 169, 79, .4);
    border-radius: 22px;
    background: rgba(255, 253, 246, .7);
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 2px;
    color: #c04a6e;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background .25s ease, border-color .25s ease, transform .25s ease, color .25s ease;
  }
  .page-btn:hover {
    background: rgba(255, 248, 235, .95);
    border-color: rgba(224, 169, 79, .75);
    transform: translateY(-2px);
  }
  .page-btn:active { transform: translateY(0) scale(.97); }

  .letter-eyebrow {
    margin: 0;
    font-family: var(--script);
    font-size: 1.05rem;
    text-align: center;
    color: #d89a4a;
    letter-spacing: 2px;
  }
  .letter-title {
    margin: 2px 0 6px;
    font-weight: 400;
    font-size: 2.3rem;
    text-align: center;
    color: #c04a6e;
    letter-spacing: 6px;
  }
  .letter-body {
    margin-top: 12px;
    line-height: 2.1;
    font-size: 1.28rem;
    color: var(--ink);
  }
  .letter-body p { margin: 0 0 4px; }
  .letter-body .salutation { color: #4a2c3a; font-size: 1.35rem; }
  .letter-body .ph { color: var(--rose); opacity: .72; font-size: 1.1rem; }
  .letter-body .gap { height: 0.7em; margin: 0; }
  .letter-body .signature { margin-top: 14px; text-align: right; font-size: 1.3rem; color: #4a2c3a; }
  .letter-body .date { text-align: right; font-size: 1rem; color: #9a7a82; letter-spacing: 2px; }
  .letter-body .poem-title { margin: 4px 0 22px; text-align: center; font-family: var(--poem); font-size: 2rem; color: #c04a6e; letter-spacing: 6px; }
  .letter-body .poem-line { text-align: center; font-family: var(--poem); font-size: 1.55rem; line-height: 2.3; margin: 0; letter-spacing: 2px; }

  /* 第二页正文：正楷体 + 首行缩进两段式，左右边距收紧 */
  .page-back { padding-left: 8px; padding-right: 8px; }
  .page-back .letter-body { font-family: var(--kai); line-height: 1.7; }
  .letter-body .para { text-indent: 2em; margin: 0 0 0.55em; }

  /* 「灼烧显影」逐字动画：光点 → 扩散成字 → 稳定（第一页在 reveal 时触发，第二页在翻到背面 on-back 时触发） */
  .ch { display: inline-block; opacity: 0; text-indent: 0; }
  .letter-stage.reveal .page-front .ch,
  .letter-stage.on-back .page-back .ch {
    animation-name: charIgnite;
    animation-duration: 1.05s;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    animation-delay: var(--d, 0s);
  }
  @keyframes charIgnite {
    0%   { opacity: 0; transform: scale(.35); color: #fff6da;
           text-shadow: 0 0 18px rgba(255,224,150,1), 0 0 38px rgba(255,190,110,.85); }
    30%  { opacity: 1; color: #fff6da; }
    65%  { color: #8a4a3a; text-shadow: 0 0 12px rgba(255,180,120,.55); }
    100% { opacity: 1; transform: scale(1); color: var(--ink); text-shadow: 0 0 0 transparent; }
  }

  /* —— 右下角控制栏（再放一次 + 静音），磨砂玻璃 + 安全区适配 —— */
  .controls {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 8;
    display: flex;
    gap: 10px;
    align-items: center;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 磨砂玻璃按钮基础（再放一次 + 静音共用） */
  .replay, .mute {
    min-width: 44px; min-height: 44px;
    border: 1px solid rgba(255, 207, 92, 0.3);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
    font-size: 1.25rem;
    letter-spacing: 2px;
    color: #ffcf5c;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .6s ease, transform .25s ease, border-color .25s ease, background .25s ease;
  }
  .replay {
    padding: 12px 28px;
    opacity: 0;
    pointer-events: none;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .mute {
    padding: 12px 14px;
    line-height: 1;
    opacity: 1;
    pointer-events: auto;
  }
  .replay:hover, .mute:hover {
    border-color: rgba(255, 207, 92, 0.65);
    background: rgba(255, 255, 255, 0.16);
    transform: translateY(-2px);
  }

  @media (max-width: 768px) {
    /* 信纸移动端：宽度 88%、max 380px，padding 缩小 20%，字号/行高适配 */
    .letter-stage { width: min(88vw, 380px); }
    .letter-flip { height: min(85vh, 600px); height: min(85dvh, 600px); }
    .page { padding: 24px 24px 27px; }
    .letter-title { font-size: 1.9rem; }
    .letter-body { font-size: 15px; line-height: 1.7; }
    .letter-body .salutation, .letter-body .signature { font-size: 17px; }
    /* 移动端按钮放大触控区域（≥44px） */
    .page-btn { padding: 12px 22px; font-size: 1rem; }
    .replay { padding: 14px 32px; font-size: 1.4rem; }
    .mute { padding: 14px 16px; font-size: 1.4rem; }
  }

  /* 横屏：避开刘海 / 手势条右侧安全区 */
  @media (orientation: landscape) and (max-width: 900px) {
    .controls { right: calc(16px + env(safe-area-inset-right, 0px)); }
  }

  /* 横屏手机：短屏下收窄信纸并压低字号，避免信纸变成过宽的横条 */
  @media (orientation: landscape) and (max-height: 500px) {
    .letter-stage { width: min(56vw, 340px); }
    .letter-flip { height: min(86vh, 480px); height: min(86dvh, 480px); }
    .page { padding: 16px 18px 18px; }
    .letter-title { font-size: 1.6rem; letter-spacing: 4px; }
    .letter-body { font-size: 13px; line-height: 1.55; }
    .letter-body .poem-line { font-size: 1.25rem; line-height: 1.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hint, .page, .ch, .fade-line, .replay, .mute, .letter-bob, .letter-flip, .page-btn { animation: none !important; transition: none !important; }
    .ch { opacity: 1; }
  }

  /* ═══════════════════════════════════════════════════════════════════
     移动端微信适配（竖屏主场景 + 横屏提示 + 截图/触控兼容）
     断点说明：
       · max-width: 768px —— 主流手机竖屏宽度上限。iPhone 15 Pro Max
         430px / Pixel 7 412px / 大屏 Android 480px 均 ≤768px；
         iPad 竖屏 768px 起被排除，避免误伤平板。
       · orientation: landscape and max-height: 500px —— 手机横屏短边。
         iPhone 15 Pro Max 横屏高 430px / Pixel 7 高 412px 均 <500px；
         平板横屏高度通常 ≥768px，被排除。
     ═══════════════════════════════════════════════════════════════════ */

  /* —— 横屏「请竖屏观看」轻提示：默认隐藏，仅横屏短屏显示 —— */
  .rotate-hint {
    display: none;
    position: fixed;
    left: 50%;
    top: calc(14px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    z-index: 9;
    padding: 10px 22px;
    border-radius: 999px;
    background: rgba(10, 10, 32, .72);
    color: #ffd98a;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 1.05rem;
    letter-spacing: 3px;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  /* —— 竖屏手机（宽度 ≤768px）—— */
  @media (max-width: 768px) {

    /* 视口：svh → dvh 替代 100vh，防 iOS URL 栏遮挡；contain 抑制微信下拉黑屏/橡皮筋 */
    body {
      min-height: 100svh;
      min-height: 100dvh;
      overscroll-behavior-y: contain;
    }

    /* 信纸高度贴合可见区域（85dvh，上限 680px）；按钮容器避让底部安全区 */
    .letter-flip { height: min(85vh, 680px); height: min(85dvh, 680px); }
    .controls { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

    /* 信纸正文允许长按选中（微信内复制/选中文字）；按钮/花苞保持不可选 */
    .letter-body, .letter-title, .letter-eyebrow {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* GPU 合成层：will-change 是 translateZ(0) 的现代等价，不改变换值、不破坏 3D 翻页 */
    .letter-stage { will-change: transform, opacity; }
    .letter-flip  { will-change: transform; }

    /* 触控：禁双击缩放 + 去 iOS 灰高亮；active 用缩放/增亮替代（正文已 ≥14px 满足截图清晰） */
    .page-btn, .replay, .mute {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .page-btn:active { filter: brightness(1.15); }
    .replay:active, .mute:active { transform: scale(.95); filter: brightness(1.2); }
  }

  /* —— 横屏手机：显示「请竖屏观看」，信纸沿用既有「居中缩小」不重排 —— */
  @media (orientation: landscape) and (max-height: 500px) {
    .rotate-hint { display: block; }
  }
</style>

<canvas id="fx" aria-label="烟花情书"></canvas>
<p class="hint" id="hint">轻触，让心绽放</p>

<div class="letter-stage" id="letterStage" aria-hidden="true">
  <div class="letter-bob">
    <div class="letter-flip" id="letterFlip">
      <!-- 第一页：诗 -->
      <article class="page page-front">
        <p class="letter-eyebrow">· for you ·</p>
        <h1 class="letter-title" id="letterTitle"></h1>
        <div class="page-scroll"><div class="letter-body" id="poemBody"></div></div>
        <div class="page-footer">
          <button class="page-btn" id="nextBtn" aria-label="下一页">下一页 ›</button>
        </div>
      </article>
      <!-- 第二页：正文 -->
      <article class="page page-back">
        <p class="letter-eyebrow">· 生日快乐 ·</p>
        <div class="page-scroll"><div class="letter-body" id="letterBody"></div></div>
        <div class="page-footer">
          <button class="page-btn" id="prevBtn" aria-label="上一页">‹ 上一页</button>
        </div>
      </article>
    </div>
  </div>
</div>

  <div class="controls" id="controls">
    <button class="replay" id="replayBtn" aria-label="再放一次">再放一次</button>
    <button class="mute" id="muteBtn" aria-label="静音" aria-pressed="false">🔊</button>
  </div>

  <div class="rotate-hint" id="rotateHint" aria-hidden="true">请竖屏观看</div>

<script>
  /* ================================================================
   * 烟花情书 —— 纯 HTML/CSS/JS 单文件
   *
   * 时间轴（点击为 t=0）：
   *   第一幕 蓄势   ：t<0        花苞心跳搏动 + 光尘螺旋收紧
   *   第二幕 炸裂   ：t=0~0.5s   闪光 + 冲击波 + 花瓣弹射(主炸)
   *                              花瓣空中二次爆开(子炸) + 信纸浮现
   *   第三幕 花雨   ：t>0.5s     花瓣飘落 10s+，信纸浮动，文字显影
   * ================================================================ */

  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const letterStage = document.getElementById('letterStage');
  const letterFlip = document.getElementById('letterFlip');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  const replayBtn = document.getElementById('replayBtn');
  const muteBtn = document.getElementById('muteBtn');

  /* ---------------- 画布 / DPR ---------------- */
  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    // iOS 动态工具栏：优先取 visualViewport（URL 栏收起/展开时 innerHeight 不变，visualViewport 才实时变化）
    const vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    layoutStatic();
  }
  window.addEventListener('resize', resize);
  // iOS 工具栏展开/收起触发 visualViewport resize，重算画布尺寸
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  // 粒子数量随屏幕面积缩放
  const area = () => W * H;
  const nByArea = (base, ref = 1280 * 800) => Math.round(base * Math.min(1, area() / ref));

  const budR = () => Math.min(W, H) * 0.15 * (isMobile() && W > H ? 0.6 : 1);   // 花苞半径（移动端横屏缩至 60%）
  const isMobile = () => window.innerWidth <= 768;   // 移动端判定

  /* ---------------- 配置（可调） ---------------- */
  const CONFIG = {
    // 花瓣数量（桌面 / 移动端，屏幕宽度 ≤768px 用移动端）
    petalCount: 28,
    petalCountMobile: 18,

    // 花瓣形状：'rose' 玫瑰 / 'sakura' 樱花
    petalShape: 'sakura',

    // 樱花瓣尺寸（直径，px）
    petalSizeMin: 10,
    petalSizeMax: 20,

    // 飘落时长（ms）：樱花更持久
    fallDuration: 20000,

    // —— 樱花模式：飘落特性 ——
    fallSpeedScale: 0.65,      // 下降速度系数（0.6~0.7）
    sakuraTerminal: 36,        // 樱花瓣下落速度上限（px/s），轻盈漂浮更持久
    swayAmpScale: 1.5,         // 正弦摇摆幅度放大
    flipSpeedScale: 1.3,       // 3D 翻转更频繁
    secondaryProb: 0.4,        // 子炸概率（樱花更柔美）
    secondarySparks: 10,       // 子炸光点数（更细腻）
    trailLengthScale: 0.7,     // 光带长度缩短 30%

    // 樱粉金配色（高级暖调：暖杏→蜜桃粉→奶油白）
    sakuraColors: ['#f8d5c8', '#f5c0a8', '#f5b8a5', '#f0a88e', '#eba08a', '#f7cdbb', '#e89b83'],

    // —— 持续樱花雨（爆炸后主角）——
    persistStart: 2.5,          // 爆炸后启动延迟（s）
    persistSizeMin: 8,          // 尺寸 8~16px（比爆炸花瓣小）
    persistSizeMax: 16,
    persistCap: 25,             // 桌面端同屏上限
    persistCapMobile: 8,        // 移动端同屏上限（拉长间隔、减少同屏以降载）
    persistIvMin: 0.4,          // 桌面端生成间隔 0.4~0.8s
    persistIvMax: 0.8,
    persistIvMobileMin: 0.8,    // 移动端生成间隔 0.8~1.5s（拉长间隔降低负载）
    persistIvMobileMax: 1.5,
  };

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  const SAKURA_TINTS = CONFIG.sakuraColors.map(hexToRgb);

  // 樱花花瓣渐变三色（内层暖杏 / 中层蜜桃粉 / 外缘奶油白）
  const C_APRICOT = [248, 213, 200];   // #f8d5c8
  const C_PEACH   = [245, 184, 165];   // #f5b8a5
  const C_CREAM   = [249, 226, 208];   // #f9e2d0
  // 黄金角（137.5°），玫瑰螺旋排布
  const GOLDEN_ANGLE = 137.5 * Math.PI / 180;
  // 持续樱花雨：较浅的 4 个樱粉渐变色阶（偏柔）
  const PERSISTENT_TINTS = [
    [248, 213, 200],  // #f8d5c8
    [245, 192, 168],  // #f5c0a8
    [247, 205, 187],  // #f7cdbb
    [245, 184, 165],  // #f5b8a5
  ];

  // 花瓣数量：按屏幕宽度选择基础值，并纳入面积自适应
  function petalCount() {
    const base = window.innerWidth <= 768 ? CONFIG.petalCountMobile : CONFIG.petalCount;
    const f = Math.min(1, area() / (1280 * 800));
    return Math.max(12, Math.round(base * f));
  }

  /* ---------------- 颜色工具 ---------------- */
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpRGB(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  }
  function rgb(c, a = 1) { return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }

  // 花瓣颜色：白热 → 金 → 樱花粉/玫瑰红（按「年龄」推进，tint 为每片花的底色）
  const C_WHITE = [255, 250, 236];
  const C_GOLD  = [255, 210, 130];
  const C_ROSE  = [230, 100, 130];
  function petalColor(age, tint = C_ROSE) {
    if (age < 0.35) return lerpRGB(C_WHITE, C_GOLD, age / 0.35);        // 爆炸瞬间：白热 → 金
    if (age < 1.3)  return lerpRGB(C_GOLD, tint, (age - 0.35) / 0.95);  // 冷却：金 → 花瓣底色
    return tint;
  }

  // 提亮颜色（amt 0~1，向白色插值）
  function brighten(c, amt) { return lerpRGB(c, [255, 255, 255], amt); }
  // 降饱和度（amt 0~1，向灰度插值）
  function desaturate(c, amt) {
    const l = c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114;
    return lerpRGB(c, [l, l, l], amt);
  }

  // 光带尾迹颜色序列：白热 #fff → 香槟金 #f7e7c6 → 樱粉 #f8c8b8 → 透明
  const TRAIL_WHITE = [255, 255, 255];
  const TRAIL_CHAMP = [247, 231, 198];
  const TRAIL_PINK  = [248, 200, 184];
  function trailColor(f) {
    // f：0(最旧/尾) ~ 1(最新/头)
    if (f < 0.5) return lerpRGB([248, 200, 184], TRAIL_PINK, f / 0.5);          // 透明感 → 樱粉
    if (f < 0.8) return lerpRGB(TRAIL_PINK, TRAIL_CHAMP, (f - 0.5) / 0.3);      // 樱粉 → 香槟金
    return lerpRGB(TRAIL_CHAMP, TRAIL_WHITE, (f - 0.8) / 0.2);                  // 香槟金 → 白热
  }

  /* ---------------- 星空 ---------------- */
  let stars = [];
  function layoutStatic() {
    stars = [];
    const n = Math.round(nByArea(70) * perfScale);   // 数量减半（低帧率时再减 30%）
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.1 + 0.3,
        a: 0.15 + Math.random() * 0.15,   // 极淡静态微光 0.15~0.3
      });
    }
  }

  /* ---------------- 花苞花瓣（爆炸前紧裹，爆炸后弹射为樱花） ---------------- */
  let petals = [];
  function buildBud() {
    petals = [];
    const r = budR();
    const n = petalCount();
    const isSakura = CONFIG.petalShape === 'sakura';
    for (let i = 0; i < n; i++) {
      const depth = i / n;   // 0 = 最内层(紧抱) ~ 1 = 最外层(外翻)
      petals.push({
        // —— 花苞：黄金角螺旋排布（玫瑰螺旋感）——
        budAngle: i * GOLDEN_ANGLE + (Math.random() - 0.5) * 0.2,
        depth,
        budLen: r * (0.32 + depth * 0.58) * (0.92 + Math.random() * 0.16),  // 外层更大、内层更小
        budWidth: 0.34 + depth * 0.2,                                        // 宽度占比随层递增
        budTilt: (10 - depth * 42) * Math.PI / 180 + (Math.random() - 0.5) * 0.06,  // 内瓣紧抱(+10°)~外瓣外翻(-32°)
        // —— 弹射后：樱花单片花瓣 ——
        size: isSakura
          ? CONFIG.petalSizeMin + Math.random() * (CONFIG.petalSizeMax - CONFIG.petalSizeMin)  // 樱花：10~20px 直径
          : r * (0.62 + Math.random() * 0.5),      // 玫瑰：保持原比例
        notch: 0.82 + Math.random() * 0.15,        // 凹口深度/位置 15% 随机差异
        asym: (Math.random() - 0.5) * 0.3,         // 左右不对称 ±0.15
        veins: 3 + Math.floor(Math.random() * 3),  // 脉络 3~5 条
        bendPhase: Math.random() * Math.PI * 2,
        bendSpeed: 2 + Math.random() * 2,
        state: 'bud',
        x: CX, y: CY, vx: 0, vy: 0,
        rot: 0, rotV: 0,
        flip: Math.random() * Math.PI * 2,
        flipV: (0.04 + Math.random() * 0.06) * (isSakura ? CONFIG.flipSpeedScale : 1),   // 樱花翻转更频繁
        age: 0,
        tint: isSakura ? SAKURA_TINTS[Math.floor(Math.random() * SAKURA_TINTS.length)] : C_ROSE,
        fallScale: isSakura ? (0.6 + Math.random() * 0.1) : 1,   // 樱花下降更慢（0.6~0.7）
        secondary: Math.random() < (isSakura ? CONFIG.secondaryProb : 0.62),
        secondaryAt: 0.45 + Math.random() * 1.1,
        secondaryDone: false,
        done: false,
        sliding: false, slideT: 0, slideDir: 0,    // 信纸贴边滑落
        fading: false, fadeT: 0,                   // 底部化为光点淡出
        swayPhase: Math.random() * Math.PI * 2,
        swaySpeed: 1.6 + Math.random() * 1.8,
        swayAmp: (14 + Math.random() * 30) * (isSakura ? CONFIG.swayAmpScale : 1),   // 樱花摇摆幅度更大
        trail: [],
      });
    }
  }

  /* ---------------- 光尘（蓄势阶段：极简星点，缓慢上漂） ---------------- */
  let dust = [];
  function buildDust() {
    dust = [];
    const n = Math.round(nByArea(60) * perfScale);   // 蓄势光尘削减至 60（低帧率时再减 30%）
    for (let i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: 1 + Math.random() * 1,          // 1~2px
        a: 0.2 + Math.random() * 0.2,         // alpha 0.2~0.4
        vx: (Math.random() - 0.5) * 0.2,      // 轻微随机水平漂移
        vy: -(0.1 + Math.random() * 0.2),     // 整体向上 0.1~0.3px/帧
        tw: Math.random() * Math.PI * 2,
        tws: 0.2 + Math.random() * 0.4,
      });
    }
  }

  /* ---------------- 动态粒子：火花 / 余烬 / 星尘 / 光点 / 光线 ---------------- */
  let sparks = [];     // 爆炸火花、子炸火花、花瓣自燃光尘
  let embers = [];     // 信纸边缘余烬
  let stardust = [];   // 第三幕下沉星尘（已弃用，保留占位）
  let shockwaves = []; // 冲击波
  let motes = [];      // 花瓣消散时上升的光点
  let rays = [];       // 爆炸瞬间金色辐射光线
  let persistentPetals = [];   // 持续樱花雨花瓣（爆炸后主角，独立管理）
  let persistTimer = 0;        // 持续樱花雨生成计时器

  /* ---------------- 状态机 ---------------- */
  let phase = 'charge';   // charge → explode → fall → (reset) → charge
  let explodeT = 0;       // 距爆炸秒数
  let opened = false;
  let hovered = false;
  let flashAlpha = 0;     // 全屏闪光
  let warmth = 0;         // 背景由深蓝 → 暖暗紫玫瑰（0→1）
  let warmthTarget = 0;   // 暖化目标（炸裂后=1，重置后=0 缓慢回深蓝）
  let veilT = -1;         // 信纸光纱扩散计时（-1 未激活）

  const GRAVITY = 620;    // px/s²
  const DRAG = 0.986;     // 每帧衰减系数
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;  // 减弱动效

  // 帧率自适应：<50fps 时减少 30% 粒子（移动端防掉帧）
  let perfScale = 1;        // 1 正常 / 0.7 降档
  let fpsEMA = 60;          // 帧率指数移动平均
  let lowFpsT = 0;          // 持续低帧率时长

  /* ================================================================
   * 音效系统：Web Audio 程序化生成（无外部音频文件）
   * ================================================================ */
  let audioCtx = null;      // AudioContext（首次用户点击时创建）
  let masterGain = null;    // 总增益（峰值 0.7，静音时 0）
  let masterMuted = false;  // 静音开关（默认开启声音）
  let breezeNodes = null;   // 持续微风噪声节点集合（便于停止）
  let breezeStarted = false; // 微风是否已启动（2.5s 触发一次）

  /* ---------------- 信纸内容（两页：第一页诗，第二页正文） ---------------- */
  // 第二页正文：正楷体，两段式
  const LETTER = {
    pageOne: {
      title: '生日快乐',
      poemTitle: '樱花放',
      poem: [
        '烟花绽于空，樱瓣开来红。',

        '我以樱花印，聊表烟花心。',

    pageTwo: {

        { t: '其实我每次都很珍惜写信的机会，很郑重写信的内容，常常信比嘴更真诚更深刻，信写下的是字，嘴说出的是话，一个字的分量可能会比一句话还重，一个字的思绪可能会比一句话还深，字没出来之前是在心里的，话没出来之前可能仅在喉咙里而已。我这人有一个毛病，弯弯绕绕说了这么多，其实并没有说到核心，是因为我紧张我怕。我想知道你还爱我吗，你最近有想过你还爱不爱我这件事吗。我两之间的距离确实有点曲折，可能仅仅一拐弯的距离，但就是没拐过来。你之前说，因为见面后太美好所以不想再见面，你知道我的心有多痛吗，我实在不理解，异地很苦，难道因为苦就不想要甜，就希望麻木地苦吗。不过，我不理解是我的无奈，我能做的还有包容，宝宝，跟我谈恋爱很苦吧，对不起。无论如何呢，我喜欢向好的方向看，生日快乐宝宝，希望你天天开心、顺心如意，这是我最纯粹的爱意与祝福，是我最深的思绪，我爱你。', cls: 'para' },
        { t: '爱你的小胡', cls: 'signature' },

  const CHAR_DELAY = 0.05;
  // 把一段文字逐字渲染进容器，返回累计延迟下标
  function appendChars(el, text, d) {
    for (const ch of text) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch;
      s.style.setProperty('--d', (Math.min(d, 80) * CHAR_DELAY) + 's');   // 显影延迟封顶 4s，避免长文逐字拖太久
      d++;
      el.appendChild(s);
    }
    return d;
  }
  // 第一页：标题 + 诗题 + 诗（reveal 时显影）
  function renderPageFront() {
    let d = 0;
    d = appendChars(document.getElementById('letterTitle'), LETTER.pageOne.title, d);
    const body = document.getElementById('poemBody');
    if (LETTER.pageOne.poemTitle) {
      const pt = document.createElement('p');
      pt.className = 'poem-title';
      d = appendChars(pt, LETTER.pageOne.poemTitle, d);
      body.appendChild(pt);
    }
    LETTER.pageOne.poem.forEach((line) => {
      const p = document.createElement('p');
      p.className = 'poem-line';
      d = appendChars(p, line, d);
      body.appendChild(p);
    });
  }
  // 第二页：正文（翻到背面 on-back 时显影）
  function renderPageBack() {
    let d = 0;
    const body = document.getElementById('letterBody');
    LETTER.pageTwo.lines.forEach((line) => {
      const p = document.createElement('p');
      p.className = line.cls || '';
      d = appendChars(p, line.t, d);
      body.appendChild(p);
    });
  }
  renderPageFront();
  renderPageBack();

  /* ---------------- 翻页：下一页（一圈半「快—慢—快」到第二页）/ 上一页（反向翻回） ---------------- */
  const FLIP_DURATION = 3500;   // 单次翻页时长（一圈半）
  const FLIP_TOTAL = 540;       // 翻转一圈半（1.5×360°=540°），540°≡180° 自然落到第二页

  // 「快—慢—快」节奏：匀速 + 正弦扰动，整体一次首尾提速、中段减速
  function flipEase(t) {
    return t + 0.13 * Math.sin(2 * Math.PI * t);
  }

  let flipToken = 0;            // reset 时递增，用于取消进行中的翻页动画
  // 逐帧驱动一圈半旋转（540°）；540°≡180° 恰好落到第二页，无需交换正反面
  function animateFlip(forward) {
    const token = ++flipToken;
    return new Promise(resolve => {
      const t0 = performance.now();
      function tick(now) {
        if (token !== flipToken) return;   // 已被 reset 取消
        let p = (now - t0) / FLIP_DURATION;
        if (p > 1) p = 1;
        const deg = flipEase(p) * FLIP_TOTAL;   // 0..540，整体一次「快—慢—快」
        letterFlip.style.transform = 'rotateY(' + (forward ? deg : FLIP_TOTAL - deg) + 'deg)';
        if (p < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }

  let flipping = false;
  function goToPage(target) {   // 0 = 第一页，1 = 第二页
    if (flipping) return;
    const onBack = letterFlip.classList.contains('flipped');
    if ((target === 1 && onBack) || (target === 0 && !onBack)) return;
    flipping = true;
    playFlipWhoosh();   // 翻页音效：柔和「唰」声
    const forward = target === 1;
    if (REDUCED) {
      // 减弱动效：不做一圈半旋转，直接静态翻面到背面
      letterFlip.classList.toggle('flipped', forward);
      letterFlip.style.transform = '';
      if (forward) letterStage.classList.add('on-back');
      flipping = false;
      return;
    }
    letterFlip.classList.toggle('flipped', forward);
    animateFlip(forward).then(() => {
      if (forward) letterStage.classList.add('on-back');   // 翻到背面后正文逐字显影
      flipping = false;
    });
  }
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goToPage(1); });
  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goToPage(0); });

  /* ---------------- 心跳（非匀速、加速感） ---------------- */
  function heartbeat(t) {
    const cycle = 2.3;
    const p = (t % cycle) / cycle;
    const b1 = Math.exp(-Math.pow((p - 0.30) / 0.09, 2));
    const b2 = Math.exp(-Math.pow((p - 0.74) / 0.055, 2));
    return b1 * 0.65 + b2 * 1.0;
  }

  /* ================================================================
   * 交互：悬停增强 / 点击炸裂
   * ================================================================ */
  canvas.addEventListener('mousemove', (e) => {
    const dx = e.clientX - CX, dy = e.clientY - CY;
    hovered = phase === 'charge' && Math.hypot(dx, dy) < budR() * 2.4;
  });
  canvas.addEventListener('mouseleave', () => { hovered = false; });

  function explode() {
    if (opened) return;
    opened = true;
    phase = 'explode';
    explodeT = 0;
    persistTimer = 0;           // 重置持续樱花雨生成计时器
    breezeStarted = false;      // 复位微风启动标记
    flashAlpha = 1;
    warmthTarget = 1;            // 背景开始暖化
    hint.classList.add('hide');
    replayBtn.classList.remove('show');   // 按钮淡出（若上次残留）
    spawnSparks(90, CX, CY, 900);

    // 多层光爆第二层：金色辐射光线（6~8 条，长度 3 倍花苞直径，渐隐更快）
    rays = [];
    const rayN = 6 + Math.floor(Math.random() * 3);
    const rayLen = budR() * 6;   // 花苞直径 = 2r，3 倍 = 6r
    for (let i = 0; i < rayN; i++) {
      rays.push({
        ang: (i / rayN) * Math.PI * 2 + Math.random() * 0.3,
        len: rayLen * (0.8 + Math.random() * 0.4),
        life: 0, maxLife: 0.1,
      });
    }

    // 花瓣由「紧裹」→「弹射」
    const r = budR();
    petals.forEach((p) => {
      p.state = 'launch';
      p.x = CX; p.y = CY;
      const ang = p.budAngle + (Math.random() - 0.5) * 0.5;
      const speed = 460 + Math.random() * 720;
      p.vx = Math.cos(ang) * speed;
      p.vy = Math.sin(ang) * speed - 150;   // 轻微上抛
      p.rotV = (Math.random() * 5 - 2.5);
    });

    // 双环冲击波：主环 + 0.1s 后更细副环（副环 alpha 降至 0.3）
    shockwaves.push({ r: r, alpha: 1, delay: 0, thin: false });
    shockwaves.push({ r: r, alpha: 0.3, delay: 0.1, thin: true });

    // 信纸浮现（材质从光体 → 实体）+ 光纱开始扩散
    setTimeout(() => {
      letterStage.classList.add('show');
      letterStage.setAttribute('aria-hidden', 'false');
      veilT = 0;
      playLetterChime();   // 音效三：信纸浮现的柔和三和弦
    }, 360);

    // 文字灼烧显影
    setTimeout(() => letterStage.classList.add('reveal'), 950);

    // 爆炸音效：五层烟花声（首次点击时创建 AudioContext，REDUCED 模式静默）
    if (!REDUCED) playExplosionChime();
    // 触觉反馈：花苞绽放的轻振动（移动端）
    if (navigator.vibrate) navigator.vibrate(10);

    // 减弱动效：爆炸后立即重绘一次静态画面（花苞消失，信纸由 DOM 直接显示）
    if (REDUCED) {
      drawBackground();
      drawStars();
      replayBtn.classList.add('show');   // 降级模式仍显示「再放一次」按钮
    }
  }

  canvas.addEventListener('click', explode);
  canvas.addEventListener('touchstart', (e) => {
    if (!opened) { e.preventDefault(); explode(); }
  }, { passive: false });
  // iOS 微信：touchend 后再 resume 一次 AudioContext（首次手势需在触摸结束时才能稳定解锁音频）
  canvas.addEventListener('touchend', () => { ensureAudioContext(); }, { passive: true });
  // 阻止长按花苞弹出系统菜单
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // 键盘可访问
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !opened) { e.preventDefault(); explode(); }
  });

  /* ================================================================
   * 「再放一次」：复位到蓄势阶段，重新开始完整循环
   * charge → explode → fall → reset → charge → ...
   * ================================================================ */
  replayBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    resetAndReplay();
    if (navigator.vibrate) navigator.vibrate(5);   // 按钮轻振动
  });

  // 静音开关：🔊/🔇（默认开启声音）
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    ensureAudioContext();
    toggleMute();
    if (navigator.vibrate) navigator.vibrate(5);   // 按钮轻振动
  });

  function resetAndReplay() {
    replayBtn.classList.remove('show');

    // 复位状态
    phase = 'charge';
    opened = false;
    explodeT = 0;
    flashAlpha = 0;
    warmthTarget = 0;            // 背景缓慢过渡回深蓝

    // 清理所有动态粒子，避免内存泄漏 / 重复渲染
    sparks = [];
    embers = [];
    stardust = [];
    shockwaves = [];
    motes = [];
    rays = [];
    persistentPetals = [];   // 清空持续樱花雨，避免上一轮残留
    persistTimer = 0;        // 重置持续樱花雨生成计时器
    breezeStarted = false;   // 复位微风启动标记
    stopBreezeNoise();       // 停止持续微风白噪声
    veilT = -1;

    // 重建花苞 + 光尘
    buildBud();
    buildDust();

    // 隐藏信纸（文字动画随类移除而复位）
    letterStage.classList.remove('reveal', 'show');
    letterStage.setAttribute('aria-hidden', 'true');

    // 复位翻页状态（回到第一页，正文显影标记清除）
    letterFlip.classList.remove('flipped');
    letterFlip.style.transform = '';
    letterStage.classList.remove('on-back');
    flipping = false;
    flipToken++;   // 取消进行中的翻页动画

    // 提示文字重现
    hint.classList.remove('hide');
  }

  /* ================================================================
   * 粒子生成
   * ================================================================ */
  function spawnSparks(n, x, y, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.25 + Math.random() * 0.9);
      sparks.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0, maxLife: 0.6 + Math.random() * 1.1,
        size: 1 + Math.random() * 2.2,
        color: Math.random() < 0.6 ? [255,224,150] : (Math.random() < .5 ? [255,190,120] : [255,235,205]),
      });
    }
  }

  function spawnStardust(n) {
    for (let i = 0; i < n; i++) {
      stardust.push({
        x: Math.random() * W,
        y: -10 - Math.random() * 60,
        vy: 14 + Math.random() * 34,
        sway: Math.random() * Math.PI * 2,
        swayV: 0.5 + Math.random() * 1.2,
        size: 0.5 + Math.random() * 1.4,
        a: 0.25 + Math.random() * 0.5,
        life: 0,
      });
    }
  }

  function spawnEmbers() {
    // 沿信纸边缘分布的金色余烬（在边缘「爬行」）
    const lr = letterStage.getBoundingClientRect();
    const per = 2 * (lr.width + lr.height);
    const n = nByArea(12);   // 余烬减至 12 颗，仅贴信纸边缘
    for (let i = 0; i < n; i++) {
      embers.push({
        pos: Math.random(),            // 沿周长的位置 0..1
        speed: 0.02 + Math.random() * 0.06,
        size: 0.8 + Math.random() * 1.6,
        a: 0.4 + Math.random() * 0.5,
        life: 0, maxLife: 2 + Math.random() * 2,
      });
    }
  }

  function emberPoint(lr, pos) {
    // 把周长位置 0..1 映射到矩形边框上的 (x,y)
    const Wl = lr.width, Hl = lr.height;
    const per = 2 * (Wl + Hl);
    let d = pos * per;
    if (d < Wl) return { x: lr.left + d, y: lr.top };
    d -= Wl;
    if (d < Hl) return { x: lr.left + Wl, y: lr.top + d };
    d -= Hl;
    if (d < Wl) return { x: lr.left + Wl - d, y: lr.top + Hl };
    d -= Wl;
    return { x: lr.left, y: lr.top + Hl - d };
  }

  /* ================================================================
   * 持续樱花雨（爆炸后主角）：独立数组 persistentPetals[]，与爆炸花瓣分离
   * 舒缓节奏从顶部飘入，底部自然淡出（不生成溶解光点）
   * ================================================================ */
  function spawnPersistentPetal() {
    persistentPetals.push({
      baseX: Math.random() * W,             // 原始路径 X（绕行后回到此）
      y: -30,
      vy: 18 + Math.random() * 30,          // 下降 18~48px/s（≈0.3~0.8px/帧，舒缓）
      age: 0,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: (Math.PI * 2) / (2 + Math.random() * 2),   // 周期 2~4s
      swayAmp: 30 + Math.random() * 30,     // ±30~60px
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.6,
      flip: Math.random() * Math.PI * 2,
      flipV: 0.5 + Math.random() * 1.0,     // 3D 翻转 0.5~1.5 rad/s
      size: CONFIG.persistSizeMin + Math.random() * (CONFIG.persistSizeMax - CONFIG.persistSizeMin),
      tint: PERSISTENT_TINTS[Math.floor(Math.random() * PERSISTENT_TINTS.length)],
      notch: 0.82 + Math.random() * 0.15,
      asym: (Math.random() - 0.5) * 0.3,
      veins: 3 + Math.floor(Math.random() * 3),
      bendPhase: Math.random() * Math.PI * 2,
      bendSpeed: 1.5 + Math.random() * 1.5,
      avoidOff: 0, avoiding: false, avoidDir: 0,   // 信纸绕行偏移
      fading: false, fadeT: 0,
    });
  }

  /* ================================================================
   * 绘制
   * ================================================================ */
  function drawBackground() {
    // 深蓝夜 → 暖暗紫玫瑰（warmth 插值，暖调带 maroon 倾向）
    const top   = lerpRGB([10, 10, 32], [45, 19, 46], warmth);
    const mid   = lerpRGB([13, 18, 46], [57, 22, 44], warmth);
    const bot   = lerpRGB([26, 16, 48], [40, 16, 36], warmth);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(top));
    g.addColorStop(0.55, rgb(mid));
    g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    // 极淡静态微光（不再闪烁，数量减半）
    for (const s of stars) {
      ctx.fillStyle = rgb([245, 240, 232], s.a);   // 微暖米白 #f5f0e8
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* 花萼：底部细长三角，深绿渐变（增加真实感） */
  function drawSepals(r) {
    for (let s = 0; s < 3; s++) {
      const a = Math.PI * 0.5 + (s - 1) * 0.42;   // 朝下，左右错开
      const slen = r * 0.62;
      const sx = CX + Math.cos(a) * r * 0.28;
      const sy = CY + Math.sin(a) * r * 0.28;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(a - Math.PI * 0.5);   // 尖端朝下
      const sg = ctx.createLinearGradient(0, 0, 0, slen);
      sg.addColorStop(0, 'rgba(44,88,52,0.95)');
      sg.addColorStop(1, 'rgba(18,46,28,0.9)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(slen * 0.3, slen * 0.45, 0, slen);
      ctx.quadraticCurveTo(-slen * 0.3, slen * 0.45, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBud(t) {
    const r = budR();
    const beat = heartbeat(t) * (hovered ? 1.35 : 1);
    const pulse = 1 + beat * 0.06;

    // 底部投影（悬浮感，暗色 alpha 0.3）
    ctx.save();
    const shg = ctx.createRadialGradient(CX, CY + r * 0.42, 0, CX, CY + r * 0.42, r * 1.4);
    shg.addColorStop(0, 'rgba(0,0,0,0.30)');
    shg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shg;
    ctx.beginPath();
    ctx.ellipse(CX, CY + r * 0.42, r * 1.4, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 花心多层脉动光晕（3 层径向渐变，随心跳呼吸）
    const glowLayers = [
      { rr: r * 0.45, a: 0.95 },
      { rr: r * 0.85, a: 0.5  },
      { rr: r * 1.45, a: 0.24 },
    ];
    for (const gl of glowLayers) {
      const rr = gl.rr * (1 + beat * 0.16);
      const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, rr);
      g.addColorStop(0, `rgba(255,247,224,${gl.a * (0.7 + beat * 0.5)})`);
      g.addColorStop(0.5, `rgba(255,220,160,${gl.a * 0.5})`);
      g.addColorStop(1, 'rgba(255,200,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(CX, CY, rr, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绿色花萼（底部，先于花瓣绘制）
    drawSepals(r);

    // 螺旋层叠花瓣：黄金角 + 外大内小 + 3D 姿态（外瓣外翻 / 内瓣紧抱）
    for (const p of petals) {
      const ang = p.budAngle;
      const len = p.budLen * pulse;
      const w = len * p.budWidth;
      const openness = 0.5 - p.budTilt * 0.8;       // 内瓣(正 tilt)→小，外瓣(负 tilt)→大
      const effW = w * (0.72 + openness * 0.5);
      const foreshorten = Math.max(0.4, Math.cos(p.budTilt));  // rotateX 纵向缩短
      const L = len * foreshorten;
      const baseR = r * 0.22;
      const bx = CX + Math.cos(ang) * baseR;
      const by = CY + Math.sin(ang) * baseR;

      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(ang);
      // 杯状玫瑰花瓣（沿 +X 从基部到尖端）
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(L * 0.2, -effW * 0.9, L * 0.75, -effW * 0.85, L, -effW * 0.12);
      ctx.bezierCurveTo(L * 0.82, 0, L * 0.82, 0, L, effW * 0.12);
      ctx.bezierCurveTo(L * 0.75, effW * 0.85, L * 0.2, effW * 0.9, 0, 0);
      ctx.closePath();
      const pg = ctx.createLinearGradient(0, 0, L, 0);
      pg.addColorStop(0, 'rgba(122,56,84,0.96)');    // 基部深玫瑰
      pg.addColorStop(0.6, 'rgba(184,92,104,0.93)');
      pg.addColorStop(1, 'rgba(220,128,112,0.92)');  // 尖端暖
      ctx.fillStyle = pg;
      ctx.fill();
      // 暗金边缘（引线发热感）
      ctx.strokeStyle = rgb([255, 196, 120], 0.3 + beat * 0.4);
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawDust(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const d of dust) {
      // 缓慢向上漂移，无螺旋轨道
      d.x += d.vx + Math.sin(t * 0.6 + d.tw) * 0.05;
      d.y += d.vy;
      if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }   // 出顶后回到底部
      if (d.x < -10) d.x = W + 10; else if (d.x > W + 10) d.x = -10;
      const a = d.a * (0.75 + 0.25 * Math.sin(t * d.tws + d.tw));  // 极轻闪烁
      ctx.fillStyle = rgb([245, 232, 208], a);   // 统一暖白 #f5e8d0
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawShockwaves(dt) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const w = shockwaves[i];
      if (w.delay > 0) { w.delay -= dt; continue; }   // 副环延迟 0.1s 后紧跟
      w.r += 1300 * dt;
      w.alpha -= dt * 1.1;
      if (w.alpha <= 0) { shockwaves.splice(i, 1); continue; }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgb([255, 224, 150], Math.max(0, w.alpha));
      ctx.lineWidth = (w.thin ? 1.4 : 3.2) * w.alpha + 0.4;   // 副环更细
      ctx.beginPath();
      ctx.arc(CX, CY, w.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 爆炸金色辐射光线（8~12 条，长度 3 倍花苞直径，渐隐） */
  function drawRays(dt) {
    if (rays.length === 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = rays.length - 1; i >= 0; i--) {
      const r = rays[i];
      r.life += dt;
      if (r.life >= r.maxLife) { rays.splice(i, 1); continue; }
      const f = 1 - r.life / r.maxLife;
      ctx.strokeStyle = rgb([255, 224, 150], f * 0.85);
      ctx.lineWidth = 1.6 * f + 0.3;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(r.ang) * 12, CY + Math.sin(r.ang) * 12);
      ctx.lineTo(CX + Math.cos(r.ang) * r.len, CY + Math.sin(r.ang) * r.len);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 樱花单片花瓣：泪滴形 + 顶部 V 凹口，贝塞尔曲线左右不对称
   * 以原点为「基部」（花心方向），沿 +X 轴延伸，凹口在尖端
   * L = 花瓣长度；col = 基础色；o = { notch, asym, veins, facing, bend } */
  function drawSakuraPetal(ctx, L, col, o = {}) {
    const notch = o.notch ?? 0.9;            // 凹口深度/位置（0.8~0.95，随机差异）
    const asym = o.asym ?? 0;                // 左右不对称 -0.15~0.15
    const facing = o.facing ?? 'front';      // front 正面暖粉 / back 背面偏白
    const veins = o.veins ?? 4;              // 脉络 3~5 条
    const bend = o.bend ?? 1;                // 随风弯曲（scaleY 0.9~1.1 循环）
    const W = L * (0.42 + Math.abs(asym) * 0.25);   // 半宽

    // 双面色：背面略浅偏白
    let base = col;
    if (facing === 'back') base = lerpRGB(col, [255, 250, 244], 0.45);

    ctx.save();
    ctx.scale(1, bend);   // 随风弯曲微变

    // 轮廓（一侧略弯、一侧略直，模拟自然花瓣）
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(L * 0.16, -W * (0.80 + asym), L * 0.55, -W * (0.88 + asym), L * 0.72, -W * 0.5);
    ctx.bezierCurveTo(L * 0.86, -W * 0.30, L * notch, -W * 0.16, L * notch, 0);
    ctx.bezierCurveTo(L * notch, W * 0.16, L * 0.86, W * 0.30, L * 0.72, W * 0.5);
    ctx.bezierCurveTo(L * 0.55, W * (0.88 - asym), L * 0.16, W * (0.80 - asym), 0, 0);
    ctx.closePath();

    // 径向渐变：基部（花心方向）最深 → 外缘半透明（透光感）
    const g = ctx.createRadialGradient(L * 0.18, 0, 0, L * 0.4, 0, L * 1.0);
    g.addColorStop(0.0, rgb(lerpRGB(base, C_APRICOT, 0.15), 0.92));   // 暖杏内层
    g.addColorStop(0.5, rgb(lerpRGB(base, C_PEACH, 0.5), 0.82));      // 蜜桃粉中层
    g.addColorStop(1.0, rgb(C_CREAM, 0.35));                          // 奶油白外缘
    ctx.fillStyle = g;
    ctx.fill();

    // 边缘微光描边（比填充色亮 2 个色阶，alpha 0.5）
    ctx.strokeStyle = rgb(brighten(base, 0.22), 0.5);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 脉络线：从基部向尖端发散的贝塞尔曲线，极细（alpha 0.15~0.25）
    ctx.strokeStyle = rgb(brighten(base, 0.35), 0.2);
    ctx.lineWidth = 0.5;
    for (let i = 0; i < veins; i++) {
      const t = veins === 1 ? 0 : (i / (veins - 1)) - 0.5;   // -0.5 ~ 0.5
      const ty = t * W * 0.72;
      ctx.beginPath();
      ctx.moveTo(L * 0.04, 0);
      ctx.bezierCurveTo(L * 0.28, ty * 0.5, L * 0.55, ty, L * 0.72, ty * 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 花瓣落到屏幕底部：化为 5~8 颗光点（金黄/粉白），向上飘升 20~40px 后淡出 */
  function spawnDissolve(p) {
    p.fading = true;
    p.fadeT = 0;
    const n = 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      motes.push({
        x: p.x + (Math.random() - 0.5) * 12,
        y: p.y + (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 8,
        vy: -(18 + Math.random() * 22),           // 向上飘升 20~40px
        life: 0, maxLife: 0.5 + Math.random() * 0.35,
        size: 1 + Math.random() * 1.5,
        color: Math.random() < 0.5 ? [255, 214, 138] : [255, 236, 214],
      });
    }
  }

  function drawMotes(dt) {
    if (motes.length === 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.life += dt;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.life >= m.maxLife) { motes.splice(i, 1); continue; }
      const f = 1 - m.life / m.maxLife;
      ctx.fillStyle = rgb(m.color, f * 0.9);
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size * f, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPetals(dt) {
    const FALL = CONFIG.fallDuration / 1000;   // 秒
    for (const p of petals) {
      if (p.state === 'bud' || p.done) continue;

      // 物理：重力 + 阻力（樱花下降更慢，fallScale 0.6~0.7）
      p.vy += GRAVITY * p.fallScale * dt;
      const drag = Math.pow(DRAG, dt * 60);
      p.vx *= drag; p.vy *= drag;
      // 樱花：轻盈漂浮——启动弹射(age<0.8s)自由飞行，之后限制下落速度上限，飘落更持久
      if (CONFIG.petalShape === 'sakura' && p.age > 0.8 && p.vy > CONFIG.sakuraTerminal) {
        p.vy = CONFIG.sakuraTerminal;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.rotV * dt;
      p.flip += p.flipV * dt;
      p.age += dt;

      // 下落时正弦摇摆
      let sway = 0;
      if (p.vy > 0) sway = Math.sin(p.age * p.swaySpeed + p.swayPhase) * p.swayAmp;

      // 信纸碰撞：贴边滑落 0.3s + 停留 0.2s 后继续下落
      const lr = letterStage.getBoundingClientRect();
      if (phase === 'fall' && lr.width > 0) {
        const inX = p.x + sway > lr.left - 4 && p.x + sway < lr.right + 4;
        const inY = p.y > lr.top - 4 && p.y < lr.bottom + 4;
        if (inX && inY && !p.sliding) {
          p.sliding = true; p.slideT = 0;
          p.slideDir = (p.x < (lr.left + lr.right) / 2) ? -1 : 1;
        }
      }
      if (p.sliding) {
        p.slideT += dt;
        const edgeX = p.slideDir < 0 ? lr.left - 6 : lr.right + 6;
        p.x += (edgeX - p.x) * Math.min(1, dt * 12);
        if (p.slideT < 0.3) p.vy = 16;                      // 沿边缘滑落
        else if (p.slideT < 0.5) p.vy = 0;                  // 贴边停留
        else { p.sliding = false; p.vy = CONFIG.sakuraTerminal * 0.5; }
      }

      // 尾迹
      p.trail.push({ x: p.x + sway, y: p.y });
      if (p.trail.length > 6) p.trail.shift();   // 光带长度缩短 30%

      // 子炸：花瓣自燃为光尘
      if (p.secondary && !p.secondaryDone && p.age >= p.secondaryAt) {
        p.secondaryDone = true;
        spawnSparks(CONFIG.secondarySparks, p.x, p.y, 260);   // 子炸光点数（樱花更细腻）
        p.done = true;
        continue;
      }

      // 到底部 / 超时：化为光点后淡出（爆炸弹射花瓣在 4s 内全部消散，让位持续樱花雨）
      if (!p.fading && (p.y > H - 25 || p.age > FALL || explodeT > 4)) spawnDissolve(p);
      if (p.fading) {
        p.fadeT += dt;
        if (p.fadeT >= 0.3) { p.done = true; continue; }
      }

      // 颜色：白热→金→樱粉 + 枯萎降饱和（100% → 70%）
      let col = petalColor(p.age, p.tint);
      const wither = Math.min(0.3, p.age * 0.03);
      col = desaturate(col, wither);
      const alpha = p.fading ? Math.max(0, 1 - p.fadeT / 0.3) : 1;

      // 尾迹光带（白热 #fff → 香槟金 → 樱粉 → 透明）
      if (p.trail.length > 1 && p.age < 2.2) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let k = 1; k < p.trail.length; k++) {
          const f = k / p.trail.length;
          ctx.strokeStyle = rgb(trailColor(f), alpha * f * 0.4);
          ctx.lineWidth = p.size * 0.06 * f;
          ctx.beginPath();
          ctx.moveTo(p.trail[k - 1].x, p.trail[k - 1].y);
          ctx.lineTo(p.trail[k].x, p.trail[k].y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 花瓣本体：双面色 + 3D 翻转 + 景深缩小 + 随风弯曲
      const facing = Math.cos(p.flip) >= 0 ? 'front' : 'back';
      const flipX = Math.abs(Math.cos(p.flip));
      const depthScale = 1 - 0.15 * Math.max(0, Math.min(1, (p.y - H * 0.5) / (H * 0.5)));
      const bend = 1 + 0.1 * Math.sin(p.age * p.bendSpeed + p.bendPhase);

      ctx.save();
      ctx.translate(p.x + sway, p.y);
      ctx.rotate(p.rot);
      ctx.scale(Math.max(0.12, flipX), 1);
      ctx.globalAlpha = alpha;

      if (CONFIG.petalShape === 'sakura') {
        // —— 樱花模式：柔和光晕 + 单片樱花花瓣 ——
        ctx.globalCompositeOperation = 'lighter';
        const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 0.9);
        glow.addColorStop(0, rgb(col, alpha * 0.24));
        glow.addColorStop(1, rgb(col, 0));
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        drawSakuraPetal(ctx, p.size * depthScale, col, {
          notch: p.notch, asym: p.asym, veins: p.veins, facing, bend,
        });
      } else {
        // 玫瑰：泪滴花瓣（未启用，保留原样）
        const len = p.size * (phase === 'fall' ? 0.9 : 1.05) * depthScale;
        const w = len * 0.42;
        const pg = ctx.createLinearGradient(0, -len, 0, len);
        pg.addColorStop(0, rgb(col, 0.95));
        pg.addColorStop(1, rgb(lerpRGB(col, C_ROSE, 0.3), 0.9));
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.moveTo(0, -len);
        ctx.quadraticCurveTo(w, -len * 0.2, w * 0.6, len * 0.2);
        ctx.quadraticCurveTo(0, len, -w * 0.6, len * 0.2);
        ctx.quadraticCurveTo(-w, -len * 0.2, 0, -len);
        ctx.closePath();
        ctx.fill();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgb([255, 220, 150], alpha * 0.25);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  /* 持续樱花雨绘制：舒缓下落 + 正弦摇摆 + 信纸绕行 + 底部淡出（无尾迹、无溶解） */
  function drawPersistentPetals(dt) {
    if (persistentPetals.length === 0) return;
    const lr = letterStage.getBoundingClientRect();
    const letterActive = phase === 'fall' && lr.width > 0;
    const pad = 30;   // 信纸避让外扩 30px

    for (let i = persistentPetals.length - 1; i >= 0; i--) {
      const pp = persistentPetals[i];
      pp.age += dt;
      pp.y += pp.vy * dt;
      pp.rot += pp.rotV * dt;
      pp.flip += pp.flipV * dt;
      const sway = Math.sin(pp.age * pp.swaySpeed + pp.swayPhase) * pp.swayAmp;

      // 信纸绕行：进入信纸外扩 30px 区域时绕到左/右侧，过后回到原路径
      if (letterActive) {
        const probeX = pp.baseX + sway + pp.avoidOff;
        const inX = probeX > lr.left - pad && probeX < lr.right + pad;
        const inY = pp.y > lr.top - pad && pp.y < lr.bottom + pad;
        if (inX && inY && !pp.avoiding) {
          pp.avoiding = true;
          pp.avoidDir = (probeX < (lr.left + lr.right) / 2) ? -1 : 1;
        }
        if (pp.avoiding) {
          const targetX = pp.avoidDir < 0 ? lr.left - pad - 16 : lr.right + pad + 16;
          pp.avoidOff += (targetX - probeX) * Math.min(1, dt * 5);
          if (pp.y > lr.bottom + pad) { pp.avoiding = false; pp.avoidDir = 0; }
        } else {
          pp.avoidOff *= (1 - Math.min(1, dt * 3));   // 回落原路径
        }
      }
      const x = pp.baseX + sway + pp.avoidOff;

      // 底部自然淡出（1s），不生成溶解光点（与爆炸花瓣区分）
      if (!pp.fading && pp.y > H - 20) { pp.fading = true; pp.fadeT = 0; }
      if (pp.fading) {
        pp.fadeT += dt;
        if (pp.fadeT >= 1) { persistentPetals.splice(i, 1); continue; }  // 移除不可见对象
      }
      if (pp.y > H + 40) { persistentPetals.splice(i, 1); continue; }

      const alpha = pp.fading ? Math.max(0, 1 - pp.fadeT) : 1;
      const facing = Math.cos(pp.flip) >= 0 ? 'front' : 'back';
      const flipX = Math.abs(Math.cos(pp.flip));
      const bend = 1 + 0.08 * Math.sin(pp.age * pp.bendSpeed + pp.bendPhase);

      ctx.save();
      ctx.translate(x, pp.y);
      ctx.rotate(pp.rot);
      ctx.scale(Math.max(0.12, flipX), 1);
      ctx.globalAlpha = alpha;
      drawSakuraPetal(ctx, pp.size, pp.tint, {
        notch: pp.notch, asym: pp.asym, veins: pp.veins, facing, bend,
      });
      ctx.restore();
    }
  }

  function drawSparks(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.maxLife) { sparks.splice(i, 1); continue; }
      s.vy += 160 * dt;
      s.vx *= 0.985; s.vy *= 0.985;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      const f = 1 - s.life / s.maxLife;
      ctx.fillStyle = rgb(s.color, f * 0.9);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.4 + f * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEmbers(dt) {
    const lr = letterStage.getBoundingClientRect();
    if (lr.width <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.pos += e.speed * dt;
      e.life += dt;
      if (e.pos >= 1) e.pos -= 1;
      if (e.life >= e.maxLife) { embers.splice(i, 1); continue; }
      const pt = emberPoint(lr, e.pos);
      const f = 1 - e.life / e.maxLife;
      const tw = 0.5 + 0.5 * Math.sin(e.life * 6);
      ctx.fillStyle = rgb([255, 210, 120], f * e.a * tw);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, e.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawStardust(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = stardust.length - 1; i >= 0; i--) {
      const s = stardust[i];
      s.y += s.vy * dt;
      s.sway += s.swayV * dt;
      s.life += dt;
      if (s.y > H + 20) { stardust.splice(i, 1); continue; }
      const x = s.x + Math.sin(s.sway) * 8;
      ctx.fillStyle = rgb([255, 230, 190], s.a * (0.6 + 0.4 * Math.sin(s.life * 3)));
      ctx.beginPath();
      ctx.arc(x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ---------------- 主循环 ---------------- */
  let last = performance.now();
  let elapsed = 0;
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;   // 防跳帧
    elapsed += dt;

    // 帧率监测（指数移动平均）：<50fps 持续 1.5s 后减 30% 粒子
    if (dt > 0) {
      const instFps = 1 / dt;
      fpsEMA += (instFps - fpsEMA) * 0.05;
      if (fpsEMA < 50) lowFpsT += dt; else lowFpsT = 0;
      if (lowFpsT > 1.5 && perfScale !== 0.7) {
        perfScale = 0.7;
        buildDust();      // 重建光尘 + 星点（按新档位）
        layoutStatic();
      }
    }

    // 减弱动效：只渲染静态画面（花苞无脉冲、无光尘漂移），不进入动画循环
    if (REDUCED) {
      drawBackground();
      drawStars(elapsed);
      if (phase === 'charge') { drawDust(elapsed); drawBud(elapsed); }
      return;
    }

    // 背景渐变：向目标值平滑过渡（炸裂后暖化、重置后缓慢回深蓝）
    warmth += (warmthTarget - warmth) * Math.min(1, dt * 0.35);

    drawBackground();
    drawStars(elapsed);

    if (phase === 'charge') {
      drawDust(elapsed);
      drawBud(elapsed);
    } else {
      // 爆炸后：光球膨胀 + 冲击波 + 辐射光线 + 花瓣 + 各类粒子
      drawDust(elapsed);
      drawShockwaves(dt);
      drawRays(dt);

      // 多层光爆（背景层，绘制在花瓣下方）
      if (explodeT < 0.3) {
        // 第一层：白金光球（爆炸初期全亮后骤降）
        const rr = 40 + explodeT * 2600;
        const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, rr);
        g.addColorStop(0, `rgba(255,250,235,${Math.max(0, 0.85 - explodeT * 3)})`);
        g.addColorStop(0.4, `rgba(255,220,150,${Math.max(0, 0.5 - explodeT * 2)})`);
        g.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(CX, CY, rr, 0, Math.PI * 2);
        ctx.fill();

        // 第三层：暖粉光晕扩散（面积最大，0.3s 内漫开；半径缩 30%，alpha 峰值降 40%）
        const pf = explodeT / 0.3;
        const pr = (60 + pf * budR() * 8) * 0.7;
        const pa = 0.33 * (1 - pf);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const pg = ctx.createRadialGradient(CX, CY, 0, CX, CY, pr);
        pg.addColorStop(0, `rgba(255,200,178,${pa})`);
        pg.addColorStop(0.5, `rgba(248,168,150,${pa * 0.55})`);
        pg.addColorStop(1, 'rgba(248,168,150,0)');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(CX, CY, pr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 花瓣主体层（自下而上：第一场雨 → 信纸余烬 → 持续樱花雨）
      drawPetals(dt);            // 爆炸弹射花瓣（第一场雨，4s 内消散）
      drawEmbers(dt);            // 信纸边缘余烬（贴边爬行）
      drawPersistentPetals(dt);  // 持续樱花雨（主角）
      drawSparks(dt);
      drawMotes(dt);

      explodeT += dt;

      // 第三幕：信纸余烬 + 持续樱花雨
      if (phase === 'explode' && explodeT > 0.5) phase = 'fall';
      if (phase === 'fall') {
        // 持续樱花雨：爆炸 2.5s 后启动，舒缓节奏从顶部飘入
        if (!REDUCED) {
          // 持续微风白噪声：爆炸 2.5s 后启动一次（REDUCED 模式跳过）
          if (!breezeStarted && explodeT > CONFIG.persistStart) {
            breezeStarted = true;
            startBreezeNoise();
          }
          persistTimer -= dt;
          if (persistTimer <= 0 && explodeT > CONFIG.persistStart) {
            const cap = Math.round((isMobile() ? CONFIG.persistCapMobile : CONFIG.persistCap) * perfScale);
            const active = persistentPetals.length + petals.filter(p => p.state !== 'bud' && !p.done).length;
            if (active < 40 && persistentPetals.length < cap) spawnPersistentPetal();
            const ivMin = isMobile() ? CONFIG.persistIvMobileMin : CONFIG.persistIvMin;
            const ivMax = isMobile() ? CONFIG.persistIvMobileMax : CONFIG.persistIvMax;
            persistTimer = ivMin + Math.random() * (ivMax - ivMin);
          }
        }
        if (embers.length === 0 && explodeT > 1.2) spawnEmbers();
      }
    }

    // 信纸光纱（晨雾状，从信纸中心缓慢扩散后消散）
    if (veilT >= 0) {
      veilT += dt;
      const vf = Math.min(1, veilT / 2.2);
      const letterW = Math.min(W * 0.9, 420);
      const vr = letterW * 0.3 * (0.7 + vf * 1.4);
      const va = 0.15 * Math.sin(Math.PI * vf);
      if (va > 0.004) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const vg = ctx.createRadialGradient(CX, CY, 0, CX, CY, vr);
        vg.addColorStop(0, `rgba(255,244,230,${va})`);
        vg.addColorStop(0.6, `rgba(255,236,214,${va * 0.5})`);
        vg.addColorStop(1, 'rgba(255,236,214,0)');
        ctx.fillStyle = vg;
        ctx.beginPath();
        ctx.arc(CX, CY, vr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      if (veilT > 2.2) veilT = -1;
    }

    // 全屏闪光（0.1s 覆盖全屏，随后淡出）
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,252,240,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
      flashAlpha = Math.max(0, flashAlpha - dt * 2.4);
    }

    // 「再放一次」按钮：爆炸 1.5s 后淡入（花雨阶段）
    if (opened && explodeT > 1.5 && !replayBtn.classList.contains('show')) {
      replayBtn.classList.add('show');
    }

    requestAnimationFrame(frame);
  }

  /* ================================================================
   * 音效系统：Web Audio 程序化生成（无外部音频文件）
   *   设计原则：真实烟花 = 宽带噪声冲击 + 低频体感 + 柔和余韵
   *             无纯高频正弦波，高频仅以极短噪声脉冲点缀（音量极低）
   *   ensureAudioContext  —— 首次用户点击时创建 / 恢复共享 AudioContext
   *   playExplosionChime  —— 爆炸声（五层：体感冲击/噪声爆裂/温暖中频/火花/余韵）
   *   playLetterChime     —— 信纸浮现的柔和三和弦（C5-E5-G5）
   *   startBreezeNoise    —— 持续微风底噪（粉红噪声，2.5s 后启动）
   *   stopBreezeNoise     —— 停止微风
   *   toggleMute          —— 静音开关（🔊/🔇）
   * ================================================================ */
  function ensureAudioContext() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;   // iOS 前缀
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = masterMuted ? 0 : 0.7;   // 总增益峰值 0.7
      masterGain.connect(audioCtx.destination);
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    } catch (e) {
      return false;   // 极老旧浏览器静默降级
    }
  }

  function toggleMute() {
    masterMuted = !masterMuted;
    if (masterGain) masterGain.gain.value = masterMuted ? 0 : 0.7;
    muteBtn.textContent = masterMuted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', String(masterMuted));
    muteBtn.setAttribute('aria-label', masterMuted ? '取消静音' : '静音');
  }

  /* —— 噪声缓冲生成：白噪声 / 粉红噪声（Paul Kellet 近似）—— */
  function makeWhiteNoiseBuffer(ac, dur) {
    const frameCount = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buffer = ac.createBuffer(1, frameCount, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frameCount; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function makePinkNoiseBuffer(ac, dur) {
    const frameCount = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buffer = ac.createBuffer(1, frameCount, ac.sampleRate);
    const data = buffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < frameCount; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
      b6 = white * 0.115926;
    }
    return buffer;
  }

  function playExplosionChime() {
    if (REDUCED || !ensureAudioContext()) return;
    try {
      const ac = audioCtx;
      const t0 = ac.currentTime + 0.01;
      const nodes = [];   // 本次爆炸创建的所有节点，结束后统一释放

      /* —— 第1层 · 体感冲击 Sub Boom：80Hz + 50Hz 双正弦，各自独立增益 —— */
      [80, 50].forEach((f) => {
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t0);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.005);           // attack 0.005s
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.005 + 0.65);  // 指数衰减 0.65s
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t0);
        osc.stop(t0 + 0.7);
        nodes.push(osc, g);
      });

      /* —— 第2层 · 噪声爆裂 Noise Burst：白噪声 → 低通 4000Hz→300Hz 扫描 —— */
      {
        const src = ac.createBufferSource();
        src.buffer = makeWhiteNoiseBuffer(ac, 0.5);
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(4000, t0);
        filter.frequency.exponentialRampToValueAtTime(300, t0 + 0.3);   // 0.3s 内扫到 300Hz
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.003);           // attack 0.003s
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.003 + 0.4);  // 指数衰减 0.4s
        src.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        src.start(t0);
        src.stop(t0 + 0.5);
        nodes.push(src, filter, g);
      }

      /* —— 第3层 · 温暖中频 Warm Punch：粉红噪声 → 带通 350Hz Q0.8 —— */
      {
        const src = ac.createBufferSource();
        src.buffer = makePinkNoiseBuffer(ac, 0.3);
        const filter = ac.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 350;
        filter.Q.value = 0.8;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.002);           // attack 0.002s
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.002 + 0.22); // 指数衰减 0.22s
        src.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        src.start(t0);
        src.stop(t0 + 0.3);
        nodes.push(src, filter, g);
      }

      /* —— 第4层 · 火花闪光 Sparkle：5~8 个极短高频噪声脉冲，随机分散（音量极低）—— */
      {
        const sparkCount = 5 + Math.floor(Math.random() * 4);   // 5~8 个
        for (let i = 0; i < sparkCount; i++) {
          const start = t0 + 0.1 + Math.random() * 0.25;        // 0.1~0.35s 间随机触发
          const dur = 0.03 + Math.random() * 0.03;              // 0.03~0.06s
          const src = ac.createBufferSource();
          src.buffer = makeWhiteNoiseBuffer(ac, 0.08);
          const filter = ac.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 2500 + Math.random() * 2500; // 2500~5000Hz 随机
          const g = ac.createGain();
          g.gain.setValueAtTime(0.0001, start);
          g.gain.exponentialRampToValueAtTime(0.04 + Math.random() * 0.04, start + 0.005); // 0.04~0.08
          g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          src.connect(filter);
          filter.connect(g);
          g.connect(masterGain);
          src.start(start);
          src.stop(start + dur);
          nodes.push(src, filter, g);
        }
      }

      /* —— 第5层 · 余韵隆隆 After-Rumble：0.4s 后启动，白噪声 → 低通 300Hz —— */
      {
        const start = t0 + 0.4;
        const dur = 1.0 + Math.random() * 0.5;   // 1.0~1.5s
        const src = ac.createBufferSource();
        src.buffer = makeWhiteNoiseBuffer(ac, dur + 0.1);
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 300;
        filter.Q.value = 1.0;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        src.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        src.start(start);
        src.stop(start + dur + 0.05);
        nodes.push(src, filter, g);
      }

      // 总时长约 2s，2.5s 后统一断开引用（各源已 stop，断开防泄漏）
      setTimeout(() => {
        nodes.forEach((n) => { try { n.disconnect(); } catch (e) {} });
      }, 2500);
    } catch (e) { /* 静默 */ }
  }

  /* 音效三：信纸浮现的柔和三和弦（C5-E5-G5，三角波，八音盒柔版） */
  function playLetterChime() {
    if (REDUCED || !ensureAudioContext()) return;
    try {
      const ac = audioCtx;
      const t0 = ac.currentTime + 0.01;
      const freqs = [523.25, 659.25, 783.99];   // C5 E5 G5（C大调三和弦）
      const nodes = [];
      freqs.forEach((f, i) => {
        const start = t0 + i * (0.8 + 0.25);    // 每音 0.8s，间隔 0.25s
        const osc = ac.createOscillator();
        osc.type = 'triangle';                  // 三角波：比正弦暖，比方波柔
        osc.frequency.setValueAtTime(f, start);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.06, start + 0.02);       // 快起
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.7);      // 指数衰减 0.7s
        osc.connect(g);
        g.connect(masterGain);
        osc.start(start);
        osc.stop(start + 0.8);
        nodes.push(osc, g);
      });
      // 3 音总长约 2.9s，3.5s 后统一释放
      setTimeout(() => {
        nodes.forEach((n) => { try { n.disconnect(); } catch (e) {} });
      }, 3500);
    } catch (e) { /* 静默 */ }
  }

  /* 音效四：翻页「唰」声 —— 柔和带通噪声上扫（300→1200Hz） */
  function playFlipWhoosh() {
    if (REDUCED || !ensureAudioContext()) return;
    try {
      const ac = audioCtx;
      const t0 = ac.currentTime + 0.01;
      const dur = 0.5;
      const src = ac.createBufferSource();
      src.buffer = makePinkNoiseBuffer(ac, dur);
      const filter = ac.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(300, t0);
      filter.frequency.exponentialRampToValueAtTime(1200, t0 + dur);
      filter.Q.value = 1.5;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(masterGain);
      src.start(t0);
      src.stop(t0 + dur);
      setTimeout(() => {
        [src, filter, g].forEach((n) => { try { n.disconnect(); } catch (e) {} });
      }, 900);
    } catch (e) { /* 静默 */ }
  }

  function startBreezeNoise() {
    if (REDUCED || !ensureAudioContext()) return;
    stopBreezeNoise();   // 先停旧风声
    try {
      const ac = audioCtx;
      const dur = 2;   // 2 秒循环片段
      const buffer = makePinkNoiseBuffer(ac, dur);   // 粉红噪声：更柔和温暖

      const src = ac.createBufferSource();
      src.buffer = buffer;
      src.loop = true;

      // 低通滤波：cutoff 600Hz（春日微风稍亮），Q 0.7
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 600;
      filter.Q.value = 0.7;

      // 基础增益 0.04，LFO1 0.2Hz ±0.01 → 在 0.03~0.05 间缓慢呼吸
      const breezeGain = ac.createGain();
      breezeGain.gain.value = 0.04;
      const lfo1 = ac.createOscillator();
      lfo1.frequency.value = 0.2;   // 0.2Hz 缓慢呼吸
      const lfo1Gain = ac.createGain();
      lfo1Gain.gain.value = 0.01;
      lfo1.connect(lfo1Gain);
      lfo1Gain.connect(breezeGain.gain);

      // LFO2 0.07Hz：调制滤波 cutoff 在 500~700Hz 间漂移，模拟自然风的不规则
      const lfo2 = ac.createOscillator();
      lfo2.frequency.value = 0.07;
      const lfo2Gain = ac.createGain();
      lfo2Gain.gain.value = 100;   // ±100Hz 围绕 600Hz
      lfo2.connect(lfo2Gain);
      lfo2Gain.connect(filter.frequency);

      src.connect(filter);
      filter.connect(breezeGain);
      breezeGain.connect(masterGain);
      src.start();
      lfo1.start();
      lfo2.start();

      breezeNodes = { src, filter, breezeGain, lfo1, lfo1Gain, lfo2, lfo2Gain };
    } catch (e) { /* 静默 */ }
  }

  function stopBreezeNoise() {
    if (!breezeNodes) return;
    try {
      const n = breezeNodes;
      if (n.src) { try { n.src.stop(); } catch (e) {} try { n.src.disconnect(); } catch (e) {} }
      if (n.lfo1) { try { n.lfo1.stop(); } catch (e) {} try { n.lfo1.disconnect(); } catch (e) {} }
      if (n.lfo2) { try { n.lfo2.stop(); } catch (e) {} try { n.lfo2.disconnect(); } catch (e) {} }
      if (n.filter) try { n.filter.disconnect(); } catch (e) {}
      if (n.breezeGain) try { n.breezeGain.disconnect(); } catch (e) {}
      if (n.lfo1Gain) try { n.lfo1Gain.disconnect(); } catch (e) {}
      if (n.lfo2Gain) try { n.lfo2Gain.disconnect(); } catch (e) {}
    } catch (e) { /* 静默 */ }
    breezeNodes = null;
  }

  // 页面卸载前停止微风，避免后台残留音频
  window.addEventListener('beforeunload', stopBreezeNoise);

  /* ---------------- 启动 ---------------- */
  resize();
  buildBud();
  buildDust();
  requestAnimationFrame(frame);
</script>
